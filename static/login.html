<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Agent — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg2: #161b22; --surface: #1c2333; --surface2: #21262d;
      --border: #30363d; --text: #e6edf3; --text2: #8b949e; --muted: #6e7681;
      --cyan: #22d3ee; --cyan-dim: rgba(34,211,238,.12); --cyan-glow: rgba(34,211,238,.3);
      --rose: #f43f5e; --rose-dim: rgba(244,63,94,.12);
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(34,211,238,.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(34,211,238,.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(34,211,238,.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(34,211,238,.08);
      animation: cardIn .4s cubic-bezier(.4,0,.2,1);
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .logo {
      display: flex; align-items: center; justify-content: center;
      width: 56px; height: 56px;
      background: var(--cyan-dim); border: 1px solid rgba(34,211,238,.3); border-radius: 14px;
      margin: 0 auto 20px; font-size: 26px;
      box-shadow: 0 0 20px var(--cyan-glow);
    }
    .title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 32px; font-family: monospace; }
    .error {
      display: flex; align-items: center; gap: 8px;
      background: var(--rose-dim); border: 1px solid rgba(244,63,94,.25);
      border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--rose);
      margin-bottom: 18px;
    }
    .label { display: block; font-size: 11px; font-weight: 600; color: var(--text2);
             text-transform: uppercase; letter-spacing: .7px; margin-bottom: 7px; }
    .group { margin-bottom: 16px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 10px 14px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: monospace; font-size: 13px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-dim); }
    input::placeholder { color: var(--muted); }
    .btn {
      width: 100%; padding: 11px; background: var(--cyan); color: #0f1117;
      border: none; border-radius: 6px; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 8px; transition: opacity .2s, box-shadow .2s, transform .1s;
    }
    .btn:hover { opacity: .88; box-shadow: 0 4px 16px var(--cyan-glow); }
    .btn:active { transform: scale(.98); }
    .footer { text-align: center; margin-top: 24px; font-size: 11px; color: var(--muted); font-family: monospace; }
    .footer span { color: var(--cyan); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 10px; color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <div class="title">RAG Agent</div>
    <div class="sub">10.22.11.11 &nbsp;·&nbsp; Personal AI</div>

    <div class="error" id="err" style="display:none">
      ⚠ Invalid username or password
    </div>

    <form id="loginForm">
      <div class="group">
        <label class="label" for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="enter username" autocomplete="username" autofocus/>
      </div>
      <div class="group">
        <label class="label" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn" type="submit">Sign In</button>
    </form>

    <div class="divider"><span>secure access</span></div>
    <div class="footer">Session auth &nbsp;·&nbsp; <span>RAG Agent</span></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = 'Signing in…'; btn.disabled = true;
      const fd = new FormData(e.target);
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: new URLSearchParams(fd),
          redirect: 'follow'
        });
        if (r.ok && r.url.endsWith('/')) {
          window.location.href = '/';
        } else if (r.status === 401) {
          document.getElementById('err').style.display = 'flex';
          setTimeout(() => { document.getElementById('err').style.display = 'none'; }, 4000);
        } else {
          window.location.href = r.url;
        }
      } catch(err) {
        document.getElementById('err').style.display = 'flex';
      }
      btn.textContent = 'Sign In'; btn.disabled = false;
    });
  </script>
</body>
</html>
